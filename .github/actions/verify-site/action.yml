name: Verify site output
description: Assert required Hugo build artifacts exist and basic SEO checks pass

runs:
  using: composite
  steps:
    - name: Check build outputs
      shell: bash
      run: |
        set -euo pipefail
        test -f public/index.html
        test -f public/sitemap.xml
        test -f public/llms.txt
        test -f public/robots.txt

        # OG images should be processed webp, not the raw multi-MB PNG fallback
        if ! grep -q 'og:image.*\.webp' public/index.html; then
          echo "Expected homepage og:image to use processed webp"
          exit 1
        fi

        # FAQPage schema only on /faq/
        if grep -q 'FAQPage' public/index.html; then
          echo "Homepage should not emit FAQPage JSON-LD"
          exit 1
        fi
        if ! grep -q 'FAQPage' public/faq/index.html; then
          echo "FAQ page should emit FAQPage JSON-LD"
          exit 1
        fi
        if grep -q 'FAQPage' public/how-it-works/index.html; then
          echo "Non-FAQ pages should not emit FAQPage JSON-LD"
          exit 1
        fi

        # 404 should be noindex and omit canonical
        if ! grep -q 'noindex, nofollow' public/404.html; then
          echo "404 page should be noindex, nofollow"
          exit 1
        fi
        if grep -q 'rel="canonical"' public/404.html; then
          echo "404 page should not include a canonical tag"
          exit 1
        fi
        if grep -q 'og:image' public/404.html; then
          echo "404 page should not include Open Graph image tags"
          exit 1
        fi

        if ! grep -q '"name":"Wavey"' public/index.html || ! grep -q 'waveyhq.dev' public/index.html; then
          echo "Homepage WebSite schema should declare Wavey with waveyhq.dev alternateName"
          exit 1
        fi

        echo "SEO verification passed"
