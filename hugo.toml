baseURL = "https://waveyhq.dev/"
languageCode = "en-us"
title = "Wavey"
enableRobotsTXT = true

[security.funcs]
getenv = ['^HUGO_', '^CI$', '^COMMIT_REF$']

[taxonomies]
  tag = "tags"
  category = "categories"

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

# Generate an llms.txt for LLM/answer-engine discovery (https://llmstxt.org)
[outputs]
  home = ["HTML", "RSS", "LLMS", "MARKDOWN", "SEARCHJSON", "COMMANDSEARCH"]
  page = ["HTML", "MARKDOWN"]
  section = ["HTML", "MARKDOWN"]

[outputFormats.SEARCHJSON]
  mediaType = "application/json"
  baseName = "search-index"
  isPlainText = true
  notAlternative = true

[outputFormats.COMMANDSEARCH]
  mediaType = "application/json"
  baseName = "command-search"
  isPlainText = true
  notAlternative = true

[outputFormats.LLMS]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  noUgly = true

[outputFormats.MARKDOWN]
  mediaType = "text/markdown"
  baseName = "index"
  isPlainText = true
  noUgly = true

[params]
  siteName = "Wavey"
  siteAlternateNames = ["Wavey RF Sensing", "Wavey WiFi Sensing", "WaveyHQ", "waveyhq.dev"]
  description = "Open-source WiFi CSI sensing on ESP32: device-free occupancy, motion, and presence detection without cameras or wearables."
  tagline = "Occupancy, motion, and presence from the WiFi environment."
  author = "Wavey Team"
  locale = "en_US"
  TitleCutting = false

  # Entity / brand links (kept consistent across metadata, schema, footer, llms.txt)
  console = "https://console.waveyhq.dev"
  status = "https://status.waveyhq.dev/"
  statusApi = "https://status.waveyhq.dev/data?page=1"
  statusBadge = "https://status.waveyhq.dev/embed-badges/live-status?align=start&background-light=f5f5f5&text-light=000000&background-dark=171717&text-dark=ffffff"
  phare = "https://phare.io"
  openpanelClientId = "b56f5d67-4dcd-42e5-a110-a7e1778df8a1"
  openpanelHosts = ["waveyhq.dev"]
  github = "https://github.com/waveyhq"
  discord = "https://discord.gg/sxh9r9UTtW"
  twitter = "https://x.com/nopeJS"
  email = "mail@waveyhq.dev"
  repo = "https://github.com/waveyhq"
  location = "India"

  keywords = [
    "WiFi CSI sensing",
    "WiFi sensing",
    "Channel State Information",
    "CSI sensing",
    "device-free occupancy detection",
    "ESP32 CSI",
    "ESP32-CSI",
    "RF sensing",
    "WiFi motion detection",
    "WiFi human detection",
    "presence detection without camera",
    "passive sensing",
    "through-wall sensing",
    "occupancy sensing",
    "privacy-preserving sensing",
  ]

[params.social]
  github = "waveyhq"
  discord = "sxh9r9UTtW"
  twitter = "nopeJS"

[[params.authors]]
  name = "Wavey Team"
  twitter = "nopeJS"

[[params.navlinks]]
  name = "Posts"
  url = "posts/"

[[params.navlinks]]
  name = "Working"
  url = "how-it-works/"

[[params.navlinks]]
  name = "Uses"
  url = "use-cases/"

[[params.navlinks]]
  name = "About"
  url = "about/"

[[params.navlinks]]
  name = "Contact"
  url = "contact/"

[markup.goldmark.extensions.passthrough]
enable = true

[markup.goldmark.extensions.passthrough.delimiters]
block = [['\[', '\]'], ['$$', '$$']]
inline = [['\(', '\)'], ['$', '$']]
