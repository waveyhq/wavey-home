baseURL = "https://wavey.nopejs.me/"
languageCode = "en-us"
title = "Wavey"
enableRobotsTXT = true

[security.funcs]
getenv = ['^HUGO_', '^CI$', '^COMMIT_REF$']

[taxonomies]
  tag = "tags"
  category = "categories"

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

# Generate an llms.txt for LLM/answer-engine discovery (https://llmstxt.org)
[outputs]
  home = ["HTML", "RSS", "LLMS"]

[outputFormats.LLMS]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  noUgly = true

[params]
  siteName = "Wavey"
  description = "Wavey is an open-source WiFi CSI sensing system that uses Channel State Information (CSI) on low-cost ESP32 nodes for device-free occupancy, motion, and presence detection - no cameras, wearables, or apps."
  tagline = "Open-source WiFi CSI sensing for device-free occupancy, motion, and presence detection - no cameras, no wearables."
  author = "Wavey Team"
  locale = "en_US"
  TitleCutting = false
  animateStyle = "animated fadeIn"

  # Entity / brand links (kept consistent across metadata, schema, footer, llms.txt)
  console = "https://console.wavey.nopejs.me"
  status = "https://status.wavey.nopejs.me/"
  github = "https://github.com/waveyhq"
  discord = "https://discord.gg/sxh9r9UTtW"
  twitter = "https://x.com/nopeJS"
  email = "mail@wavey.nopejs.me"
  repo = "https://github.com/waveyhq"
  location = "India"

  keywords = [
    "WiFi CSI sensing",
    "WiFi sensing",
    "Channel State Information",
    "CSI sensing",
    "device-free occupancy detection",
    "ESP32 CSI",
    "ESP32-CSI",
    "RF sensing",
    "WiFi motion detection",
    "WiFi human detection",
    "presence detection without camera",
    "passive sensing",
    "through-wall sensing",
    "occupancy sensing",
    "privacy-preserving sensing",
  ]

[params.social]
  github = "waveyhq"
  discord = "sxh9r9UTtW"
  twitter = "nopeJS"

[[params.authors]]
  name = "Wavey Team"
  twitter = "nopeJS"

[[params.navlinks]]
  name = "working"
  url = "how-it-works/"

[[params.navlinks]]
  name = "uses"
  url = "use-cases/"

[[params.navlinks]]
  name = "posts"
  url = "posts/"

[[params.navlinks]]
