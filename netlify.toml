[build]
  command = "hugo --gc --minify"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.145.0"
  HUGO_EXTENDED = "true"
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "hugo --gc --minify --buildFuture --buildDrafts"

[context.branch-deploy]
  command = "hugo --gc --minify --buildFuture"

[[edge_functions]]
  path = "/*"
  function = "markdown-negotiation"

[[headers]]
  for = "/"
  [headers.values]
    Link = '</.well-known/api-catalog>; rel="api-catalog", </llms.txt>; rel="describedby"; type="text/plain", </.well-known/agent-skills/index.json>; rel="describedby"; type="application/json", </auth.md>; rel="service-doc"; type="text/markdown", </.well-known/mcp/server-card.json>; rel="describedby"; type="application/json", </.well-known/oauth-authorization-server>; rel="service-desc"; type="application/json"'

[[headers]]
  for = "/index.html"
  [headers.values]
    Link = '</.well-known/api-catalog>; rel="api-catalog", </llms.txt>; rel="describedby"; type="text/plain", </.well-known/agent-skills/index.json>; rel="describedby"; type="application/json", </auth.md>; rel="service-doc"; type="text/markdown", </.well-known/mcp/server-card.json>; rel="describedby"; type="application/json", </.well-known/oauth-authorization-server>; rel="service-desc"; type="application/json"'

[[headers]]
  for = "/.well-known/api-catalog"
  [headers.values]
    Content-Type = 'application/linkset+json; profile="https://www.rfc-editor.org/info/rfc9727"'

[[headers]]
  for = "/.well-known/oauth-authorization-server"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/oauth-protected-resource"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/openid-configuration"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/jwks.json"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/mcp/server-card.json"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/agent-skills/index.json"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/auth.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/*/index.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/index.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/resources/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/hugo-theme-console/font/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/oneko.gif"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/katex/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'sha256-1Qiq9kwIp9qejpW+9w5YNtzC0RiAf2NQrMo0DCBRisY=' 'sha384-8GQF3YN5BSrBflgFd3KjgY5ETSiWNZwlUKHhKQB/XeACoEZcyTnncViEfyO9VlDh' 'sha384-MsXY0DSsFAl7pD36l8Kd4U334IAWclTLcX+2Mpw3us54EiSnVCu7rCoIc0D9gT2l' 'sha384-TpwAaxaru1d2wqRUoiVI6pmBAAAAuz4UwRv/qGZC5T67vtyQA6tMROHkB2xVlqdQ' 'sha384-UkE7LjkLR6O+kgLv2y5cdYSq7reGZ3tf50/By4d/ux7bP4I/9S05uIt1n6AZm5fM' 'sha384-cMkvdD8LoxVzGF/RPUKAcvmm49FQ0oxwDF3BGKtDXcEc+T1b2N+teh/OJfpU0jr6' 'sha384-hCXGrW6PitJEwbkoStFjeJxv+fSOOQKOPbJxSfM6G5sWZjAyWhXiTIIAmQqnlLlh' 'sha384-nZ3wXMtnkUAAIxyNVL5lIIL2HEcMDiq3MqZQoPyIIC9u5JSwop+VrKyaLS9FxJXI' 'sha384-oVYXTAmyr6qvPEBJ6C3tMLDjByjF0fojzccSPbSbHZv7IRCgJbypjGzoJr+qvkGZ' 'sha384-sg4gBRJTqTCyzYbB7e72xGs3dA2LK994XRZS6urZW6Uh6Mu3j2JJ3YG2s9HALO8U' 'strict-dynamic' https://js.sentry-cdn.com https://browser.sentry-cdn.com https://www.datadoghq-browser-agent.com https://www.googletagmanager.com https://cloud.umami.is https://pstat.wavey.nopejs.me https://*.i.posthog.com https://*.posthog.com; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://wavey.nopejs.me https://www.google-analytics.com https://www.googletagmanager.com https://*.sentry.io https://pstat.wavey.nopejs.me https://*.i.posthog.com https://*.posthog.com https://*.posthogusercontent.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://status.wavey.nopejs.me https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.sentry.io https://browser-intake-us5-datadoghq.com https://*.browser-intake-us5-datadoghq.com https://*.datadoghq.com https://www.google-analytics.com https://*.google-analytics.com https://analytics.google.com https://stats.g.doubleclick.net https://cloud.umami.is https://gateway.umami.is https://pstat.wavey.nopejs.me https://us.posthog.com https://*.i.posthog.com https://*.posthog.com wss://pstat.wavey.nopejs.me; worker-src 'self' blob:; child-src blob:; frame-src 'self' https://*.sentry.io https://