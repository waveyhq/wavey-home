[build]
  command = "hugo --gc --minify"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.145.0"
  HUGO_EXTENDED = "true"
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "hugo --gc --minify --buildFuture --buildDrafts"

[context.branch-deploy]
  command = "hugo --gc --minify --buildFuture"

# Legacy domain redirects → waveyhq.dev (301 permanent)
# Add each source host as a domain alias on this Netlify site (Domain management).
# console/status/pstat aliases only apply here if those hostnames point at this deploy;
# otherwise configure matching rules on those services' Netlify sites.

[[redirects]]
  from = "https://wavey.nopejs.me/*"
  to = "https://waveyhq.dev/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://wavey.nopejs.me"
  to = "https://waveyhq.dev/"
  status = 301
  force = true

[[redirects]]
  from = "https://console.wavey.nopejs.me/*"
  to = "https://console.waveyhq.dev/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://console.wavey.nopejs.me"
  to = "https://console.waveyhq.dev/"
  status = 301
  force = true

[[redirects]]
  from = "https://status.wavey.nopejs.me/*"
  to = "https://status.waveyhq.dev/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://status.wavey.nopejs.me"
  to = "https://status.waveyhq.dev/"
  status = 301
  force = true

[[redirects]]
  from = "https://pstat.wavey.nopejs.me/*"
  to = "https://pstat.waveyhq.dev/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://pstat.wavey.nopejs.me"
  to = "https://pstat.waveyhq.dev/"
  status = 301
  force = true

[[redirects]]
  from = "https://wavey-home.netlify.app/*"
  to = "https://waveyhq.dev/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://wavey-home.netlify.app"
  to = "https://waveyhq.dev/"
  status = 301
  force = true

[[edge_functions]]
  path = "/.well-known/http-message-signatures-directory"
  function = "web-bot-auth-directory"

[[edge_functions]]
  path = "/*"
  function = "markdown-negotiation"

[[headers]]
  for = "/"
  [headers.values]
    Link = '</.well-known/api-catalog>; rel="api-catalog", </llms.txt>; rel="describedby"; type="text/plain", </.well-known/agent-skills/index.json>; rel="describedby"; type="application/json", </auth.md>; rel="service-doc"; type="text/markdown", </.well-known/mcp/server-card.json>; rel="describedby"; type="application/json", </.well-known/oauth-authorization-server>; rel="service-desc"; type="application/json", </.well-known/http-message-signatures-directory>; rel="describedby"; type="application/http-message-signatures-directory+json"'

[[headers]]
  for = "/index.html"
  [headers.values]
    Link = '</.well-known/api-catalog>; rel="api-catalog", </llms.txt>; rel="describedby"; type="text/plain", </.well-known/agent-skills/index.json>; rel="describedby"; type="application/json", </auth.md>; rel="service-doc"; type="text/markdown", </.well-known/mcp/server-card.json>; rel="describedby"; type="application/json", </.well-known/oauth-authorization-server>; rel="service-desc"; type="application/json", </.well-known/http-message-signatures-directory>; rel="describedby"; type="application/http-message-signatures-directory+json"'

[[headers]]
  for = "/.well-known/api-catalog"
  [headers.values]
    Content-Type = 'application/linkset+json; profile="https://www.rfc-editor.org/info/rfc9727"'

[[headers]]
  for = "/.well-known/oauth-authorization-server"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/oauth-protected-resource"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/openid-configuration"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/http-message-signatures-directory"
  [headers.values]
    Content-Type = "application/http-message-signatures-directory+json"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/.well-known/jwks.json"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/mcp/server-card.json"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/agent-skills/index.json"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/auth.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/*/index.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/index.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/resources/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/hugo-theme-console/font/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/katex/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-1Qiq9kwIp9qejpW+9w5YNtzC0RiAf2NQrMo0DCBRisY=' 'sha384-UkE7LjkLR6O+kgLv2y5cdYSq7reGZ3tf50/By4d/ux7bP4I/9S05uIt1n6AZm5fM' 'sha384-d8Rmtmctc36/RHv5f5R77/5GRXToFWmPxLjkSHaVC4nNRi+2InryQvKEnh8R5duZ' 'sha384-nZ3wXMtnkUAAIxyNVL5lIIL2HEcMDiq3MqZQoPyIIC9u5JSwop+VrKyaLS9FxJXI' 'sha384-geEL5SsOssiYP8M+UHo6BZ8AUuQw0WLaydl0T5BYayyk2p/0/hk5QZgfvXlKhMv2' 'sha384-8We9VsZ5qWKzrxOr7JYhEjgsVg/HQX59V/wv2CRbrsjg6UrnW6vr1JT6FLUkv0MA' 'sha384-cMkvdD8LoxVzGF/RPUKAcvmm49FQ0oxwDF3BGKtDXcEc+T1b2N+teh/OJfpU0jr6' 'sha384-hCXGrW6PitJEwbkoStFjeJxv+fSOOQKOPbJxSfM6G5sWZjAyWhXiTIIAmQqnlLlh' 'sha384-sg4gBRJTqTCyzYbB7e72xGs3dA2LK994XRZS6urZW6Uh6Mu3j2JJ3YG2s9HALO8U' 'sha384-TpwAaxaru1d2wqRUoiVI6pmBAAAAuz4UwRv/qGZC5T67vtyQA6tMROHkB2xVlqdQ' https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://cloud.umami.is https://pstat.waveyhq.dev https://*.i.posthog.com https://*.posthog.com https://static.cloudflareinsights.com; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://waveyhq.dev https://www.google-analytics.com https://www.googletagmanager.com https://pstat.waveyhq.dev https://*.i.posthog.com https://*.posthog.com https://*.posthogusercontent.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://status.waveyhq.dev https://www.google-analytics.com https://*.google-analytics.com https://analytics.google.com https://stats.g.doubleclick.net https://cloud.umami.is https://gateway.umami.is https://pstat.waveyhq.dev https://us.posthog.com https://*.i.posthog.com https://*.posthog.com wss://pstat.waveyhq.dev https://cloudflareinsights.com https://static.cloudflareinsights.com; worker-src 'self' blob:; child-src blob:; frame-src 'self' https://*.posthog.com; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
