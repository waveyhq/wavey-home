{{- $variant := .variant | default "bottom" -}}
<button type="button" class="command-menu-trigger command-menu-trigger--{{ $variant }}" data-slot="command-menu-trigger" aria-label="Search" aria-controls="site-search" aria-expanded="false">
  <svg class="command-menu-trigger__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="11" cy="11" r="7"></circle>
    <path d="M20 20l-3.5-3.5"></path>
  </svg>
  <span class="command-menu-trigger__label">Search…</span>
  <span class="command-menu-trigger__kbd-group command-menu-trigger__kbd-group--mac" aria-hidden="true">
    <kbd class="cmdk__kbd cmdk__kbd--compact">⌘</kbd>
    <kbd class="cmdk__kbd cmdk__kbd--compact">K</kbd>
  </span>
  <span class="command-menu-trigger__kbd-group command-menu-trigger__kbd-group--win" aria-hidden="true">
    <kbd class="cmdk__kbd cmdk__kbd--compact">Ctrl</kbd>
    <kbd class="cmdk__kbd cmdk__kbd--compact">K</kbd>
  </span>
</button>
