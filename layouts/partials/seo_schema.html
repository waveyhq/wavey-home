{{- if .IsHome -}}
<script type="application/ld+json">
[
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Wavey",
    "alternateName": "Wavey RF Sensing",
    "url": "{{ .Site.BaseURL }}",
    "description": "{{ .Site.Params.description }}"
  },
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Wavey",
    "url": "{{ .Site.BaseURL }}",
    "logo": "{{- $logo := resources.Get "images/wavey-meta/wavey-logo.ico" -}}{{- with $logo -}}{{ .Permalink }}{{- else -}}{{ "images/wavey-meta/wavey-logo.ico" | absURL }}{{- end -}}"
  }
]
</script>

{{- else if .IsPage -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": "{{ .Title }}",
  "description": "{{ with .Description }}{{ . }}{{ else }}{{ .Summary }}{{ end }}",
  "url": "{{ .Permalink }}",
  "datePublished": "{{ if not .PublishDate.IsZero }}{{ .PublishDate.Format "2006-01-02T15:04:05-07:00" }}{{ else }}{{ .Date.Format "2006-01-02T15:04:05-07:00" }}{{ end }}",
  "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05-07:00" }}",
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ .Permalink }}"
  },
  "author": {
    "@type": "Person",
    "name": "Sabique Islam",
    "url": "{{ .Site.BaseURL }}"
  },
    "publisher": {
      "@type": "Organization",
      "name": "{{ .Site.Title }}",
      "logo": {
        "@type": "ImageObject",
        "url": "{{- $logo := resources.Get "images/wavey-meta/wavey-logo.ico" -}}{{- with $logo -}}{{ .Permalink }}{{- else -}}{{ "images/wavey-meta/wavey-logo.ico" | absURL }}{{- end -}}"
      }
    }

}
</script>
{{- end -}}
