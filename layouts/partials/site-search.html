{{- $cmdkLogo := resources.Get "images/wavey-meta/wavey-logo-nobg.png" | resources.Copy "resources/images/wavey-logo-nobg.png" -}}
{{- $cmdkLogo24 := $cmdkLogo.Resize "x24 webp q90" -}}

<div id="site-search" class="cmdk-root" aria-hidden="true" hidden inert>
  <div class="cmdk__panel" role="dialog" aria-modal="true" aria-label="Command Palette">
    <div class="cmdk__input-wrap">
      <svg class="cmdk__search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="M20 20l-3.5-3.5"></path>
      </svg>
      <input id="site-search-input" class="cmdk__input" type="text" inputmode="search" enterkeyhint="search" placeholder="Type a command or search…" autocomplete="off" spellcheck="false" aria-controls="site-search-list" aria-autocomplete="list" role="combobox" aria-expanded="false">
    </div>

    <div class="cmdk__list-shell">
      <div id="site-search-list" class="cmdk__list" role="listbox" aria-label="Search results"></div>
      <p id="site-search-empty" class="cmdk__empty" hidden>No results found.</p>
    </div>

    <div class="cmdk__footer-spacer" aria-hidden="true"></div>
    <div class="cmdk__footer">
      <img class="cmdk__footer-mark" src="{{ $cmdkLogo24.RelPermalink }}" alt="" width="{{ $cmdkLogo24.Width }}" height="{{ $cmdkLogo24.Height }}" decoding="async">
      <div class="cmdk__footer-action">
        <span id="site-search-action-label">Go to page</span>
        <kbd class="cmdk__kbd" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 10l-5 5 5 5"></path>
            <path d="M20 4v7a4 4 0 0 1-4 4H4"></path>
          </svg>
        </kbd>
      </div>
    </div>
  </div>
</div>
