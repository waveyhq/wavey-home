{{ define "main" }}
<article class="post-single">
    <header class="post-header">
        <h1>{{ .Title }}</h1>
        <time class="date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format ":date_medium" }}</time>
    </header>
    <div class="post-body">
        {{ .Content }}
    </div>
</article>
{{ end }}
